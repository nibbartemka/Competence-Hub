services:
  backend:
    build:
      context: ./backend
    container_name: competence-hub-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      APP__HOST: ${BACKEND_HOST}
      APP__PORT: ${BACKEND_PORT}
      SQLITE__PATH: ${SQLITE_PATH}
      REDIS__URL: ${REDIS_URL}
      REDIS__ENABLED: ${REDIS_ENABLED}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE}
    container_name: competence-hub-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: competence-hub-nginx
    environment:
      NGINX_FRONTEND_UPSTREAM: ${NGINX_FRONTEND_UPSTREAM}
      NGINX_BACKEND_UPSTREAM: ${NGINX_BACKEND_UPSTREAM}
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: competence-hub-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  backend_data:
  backend_uploads:
  redis_data:
